name: Release

# Pushing a tag like v0.9.0 builds and tests the Windows and Linux packages (downloadable as workflow
# artifacts). To attach CI-built packages to the GitHub Release, run this workflow manually on the
# tag (Actions → Release → Run workflow). The website's download buttons use the latest release's files.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux x64 (portable, Wayland + X11)
    runs-on: ubuntu-22.04          # oldest supported glibc
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zip libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols libdecor-0-dev \
            libpulse-dev libasound2-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libibus-1.0-dev
      - name: Build, test and package
        run: tools/package/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/ShadowVeil-*-linux-x64.tar.gz

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSV_RELEASE=ON
          cmake --build build --parallel
      - name: Test
        env:
          SHADOW_VEIL_DATA: ${{ github.workspace }}
        run: ctest --test-dir build --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(ShadowVeil VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          cmake --install build --prefix dist/ShadowVeil --strip
          Copy-Item tools/package/README-player.txt dist/ShadowVeil/README.txt
          Compress-Archive -Path dist/ShadowVeil -DestinationPath "dist/ShadowVeil-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/ShadowVeil-*-windows-x64.zip

  publish:
    name: Publish release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum ShadowVeil-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
